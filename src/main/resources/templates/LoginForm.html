<!DOCTYPE html>
<html lang="km" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើប្រាស់ - Login | BELTEI International University</title>
    <!-- Modern Google Fonts with Khmer font Kantumruy Pro & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --navy-dark: #0f172a;
            --navy-card: #1e293b;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --bg-gradient: linear-gradient(135deg, #091e42 0%, #0f2757 35%, #1e3a8a 70%, #1e40af 100%);
            --card-bg: #ffffff;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: 24px 16px;
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle decorative background circles */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            pointer-events: none;
        }
        body::before {
            width: 450px;
            height: 450px;
            background: #3b82f6;
            top: -100px;
            left: -100px;
        }
        body::after {
            width: 400px;
            height: 400px;
            background: #60a5fa;
            bottom: -100px;
            right: -100px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Brand & Logo Header */
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .university-badge {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            margin-bottom: 14px;
            color: #ffffff;
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--navy-dark);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .brand-header p {
            font-size: 13.5px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Alert Messages */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            line-height: 1.45;
            margin-bottom: 20px;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger);
        }

        .alert-success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success);
            animation: none;
        }

        .alert svg {
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-dark);
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
            font-family: inherit;
            color: var(--navy-dark);
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .form-input.has-toggle {
            padding-right: 44px;
        }

        .form-input:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .form-input::placeholder {
            color: #94a3b8;
            font-size: 13.5px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s ease;
        }

        .toggle-btn:hover {
            color: var(--primary);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            box-shadow: 0 6px 20px 0 rgba(37, 99, 235, 0.45);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Demo Notice */
        .demo-hint {
            margin-top: 18px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
        .demo-hint code {
            font-weight: 600;
            color: #1e40af;
            background: #e0e7ff;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Footer Link */
        .card-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .card-footer a:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        .university-copyright {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }
            .brand-header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="card">
        <!-- University Brand / Header -->
        <div class="brand-header">
            <div class="university-badge">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1>ចូលប្រើប្រាស់គណនី</h1>
            <p>BELTEI International University Portal</p>
        </div>

        <!-- Success Message Alert (from register or logout) -->
        <div class="alert alert-success" th:if="${success}" role="status">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${success}"></span>
        </div>

        <!-- Error Message Alert -->
        <div class="alert alert-error" th:if="${error}" role="alert">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${error}"></span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" id="loginForm">
            <!-- Username Input -->
            <div class="form-group">
                <label class="form-label" for="username">ឈ្មោះគណនី / Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input class="form-input" 
                           id="username" 
                           name="username" 
                           type="text" 
                           th:value="${username}" 
                           placeholder="បញ្ចូលឈ្មោះគណនី (e.g. admin)" 
                           autocomplete="username" 
                           required>
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label class="form-label" for="password">លេខសម្ងាត់ / Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input class="form-input has-toggle" 
                           id="password" 
                           name="password" 
                           type="password" 
                           placeholder="បញ្ចូលលេខសម្ងាត់" 
                           autocomplete="current-password" 
                           required>
                    <button type="button" class="toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password" aria-label="Toggle Password Visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="loginBtn">
                <span>ចូលគណនី (Sign In)</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
            </button>
        </form>
        
        <!-- Demo Credentials Hint -->
        <div class="demo-hint">
            💡 Sample account: <code>admin</code> / <code>123456</code>
        </div>

        <!-- Footer / Link to Register -->
        <div class="card-footer">
            <span>មិនទាន់មានគណនីមែនទេ? (Don't have an account?) </span>
            <a th:href="@{/register}">ចុះឈ្មោះនៅទីនេះ (Register)</a>
        </div>
    </div>

    <!-- Copyright -->
    <div class="university-copyright">
        © 2026 BELTEI International University. All rights reserved.
    </div>
</div>

<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';

        btn.innerHTML = isPassword
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                 <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                 <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                 <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                 <line x1="2" y1="2" x2="22" y2="22"/>
               </svg>`
            : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                 <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                 <circle cx="12" cy="12" r="3"/>
               </svg>`;
    }
</script>

</body>
</html>
